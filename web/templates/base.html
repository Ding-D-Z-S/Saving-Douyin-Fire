<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>{% block title %}抖音续火花控制台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>抖音续火花控制台</h1>
      <p>仅监听 127.0.0.1 的本地页面控制台</p>
    </div>
    <nav>
      <a href="{{ url_for('index') }}">首页</a>
      <a href="{{ url_for('config_page') }}">配置</a>
      <a href="{{ url_for('results_page') }}">结果</a>
      <a href="{{ url_for('feishu_page') }}">机器人配置</a>
    </nav>
  </header>

  <main class="container">
    {% if flash %}
      <div class="flash {{ flash.level }}">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
